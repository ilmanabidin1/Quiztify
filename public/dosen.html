<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Unisba, Panel Dosen</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --ink:#0b1a30; --ink-soft:#3a4a63; --muted:#71809b; --line:#e4e9f2;
    --bg:#fff; --bg-soft:#f6f8fb; --blue:#1552b3; --blue-soft:#eaf1fd;
    --amber:#f5a623; --amber-soft:#fdf3e0; --green:#1a8a5a; --green-soft:#e8f5ef; --red:#c23b3b;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:var(--bg-soft);color:var(--ink);min-height:100vh}
  header{background:var(--ink);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:11px}
  .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--blue),#2d6fe0);display:flex;align-items:center;justify-content:center;font-size:14px}
  header b{font-size:15px;display:block;line-height:1.2}
  header span{font-size:10.5px;color:#8fa2bf}
  .wrap{max-width:960px;margin:0 auto;padding:22px 18px}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  h2{font-size:16px;font-weight:600;margin-bottom:12px}
  .input,.ta,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px;color:var(--ink);outline:none;background:var(--bg)}
  .input:focus,.ta:focus,select:focus{border-color:var(--blue)}
  .ta{resize:vertical;min-height:48px}
  label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin:10px 0 5px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;border:none;background:var(--blue);color:#fff}
  .btn:hover{background:#10469a}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:var(--bg);border:1px solid var(--line);color:var(--ink-soft)}
  .btn-danger{background:var(--bg);border:1px solid var(--line);color:var(--red)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .q-card{border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:12px}
  .q-card:focus-within{border-color:var(--blue)}
  .q-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .q-num{width:26px;height:26px;border-radius:7px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .q-head .grow{flex:1;font-size:12px;color:var(--muted)}
  .opt-row{display:flex;align-items:center;gap:9px;margin-top:8px}
  .radio{width:18px;height:18px;border-radius:50%;border:2px solid #c4cede;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .radio.correct{border-color:var(--green)}
  .radio.correct::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--green)}
  .opt-row .input{flex:1}
  .key-hint{font-size:11px;color:var(--green);font-weight:700;white-space:nowrap}
  .tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .tag-pre{background:var(--amber-soft);color:#a86a00}
  .tag-post{background:var(--blue-soft);color:var(--blue)}
  .tag-click{cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:9px 12px;background:var(--bg-soft);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
  td{padding:10px 12px;border-bottom:1px solid var(--line)}
  tr:last-child td{border:none}
  .muted{color:var(--muted);font-size:13px}
  .row{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border:none}
  .row.click{cursor:pointer}
  .row.click:hover{background:var(--bg-soft)}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink-soft)}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .topline{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .hidden{display:none}
  .err{color:var(--red);font-size:13px;margin-top:8px}
  .statbox{border:1px solid #cddcf7;background:var(--blue-soft);border-radius:12px;padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .modal{position:fixed;inset:0;background:rgba(11,26,48,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal .box{background:var(--bg);border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:20px 22px}
  .qr-img{width:200px;height:200px;border:1px solid var(--line);border-radius:10px}
</style>
</head>
<body>
<header>
  <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
  <div><b>Quiz Unisba</b><span>Panel Dosen</span></div>
</header>
<div class="wrap" id="app"></div>

<script>
const app = document.getElementById('app');
let me = null, kelasNow = null, draft = null, tabNow = 'hasil';

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 401) { me = null; renderLogin(); throw { error: 'unauth' }; }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw d;
  return d;
}

// ===== login =====
function renderLogin(){
  app.innerHTML = `
  <div class="card" style="max-width:420px;margin:40px auto">
    <h2><i class="fa-solid fa-lock"></i> Masuk Panel Dosen</h2>
    <label>Email</label><input class="input" id="in-email" autocomplete="username">
    <label>Password</label><input class="input" type="password" id="in-pass" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div style="margin-top:14px"><button class="btn" onclick="doLogin()"><i class="fa-solid fa-unlock"></i> Masuk</button></div>
    <p class="err hidden" id="l-err"></p>
  </div>`;
}
async function doLogin(){
  try {
    me = await api('/api/auth/dosen/login', { method:'POST', body: JSON.stringify({
      email: document.getElementById('in-email').value.trim(),
      password: document.getElementById('in-pass').value }) });
    renderDashboard();
  } catch (e) {
    const el = document.getElementById('l-err');
    el.textContent = e.error || 'Gagal masuk';
    el.classList.remove('hidden');
  }
}
async function logout(){ await api('/api/auth/logout', { method:'POST' }); me = null; renderLogin(); }

// ===== dashboard kelas =====
async function renderDashboard(){
  const list = await api('/api/dosen/classes');
  app.innerHTML = `
  <div class="topline">
    <div style="flex:1"><h2 style="margin:0">Dashboard Dosen</h2><div class="muted">${me.nama} · ${me.email}</div></div>
    <button class="btn" onclick="renderFormKelas()"><i class="fa-solid fa-plus"></i> Buat Kelas</button>
    <button class="btn btn-ghost" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
  <div class="card">
    <h2>Kelas Kamu</h2>
    ${list.length === 0 ? '<p class="muted">Belum ada kelas. Buat kelas dulu, lalu mahasiswa bisa daftar dengan memilih kelas itu.</p>' : ''}
    ${list.map(c => `
      <div class="row click" onclick="bukaKelas(${c.id})">
        <i class="fa-solid fa-users" style="color:var(--blue)"></i>
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${c.name}</div>
          <div class="muted" style="font-size:11.5px;margin-top:2px">${c.course || 'tanpa mata kuliah'} · ${c.n_students} mahasiswa · ${c.n_quizzes} quiz</div>
        </div>
        <i class="fa-solid fa-chevron-right" style="color:var(--muted)"></i>
      </div>`).join('')}
  </div>`;
}
function renderFormKelas(){
  app.innerHTML = `
  <div class="topline"><button class="btn btn-ghost" onclick="renderDashboard()"><i class="fa-solid fa-arrow-left"></i></button>
    <h2 style="margin:0">Buat Kelas Baru</h2></div>
  <div class="card" style="max-width:520px">
    <label>Nama Kelas</label><input class="input" id="f-name" placeholder="misal: 3A - Manajemen Keuangan I">
    <label>Mata Kuliah</label><input class="input" id="f-course" placeholder="misal: Manajemen Keuangan I">
    <div style="margin-top:14px"><button class="btn" onclick="buatKelas()"><i class="fa-solid fa-plus"></i> Buat</button></div>
    <p class="err hidden" id="c-err"></p>
  </div>`;
}
async function buatKelas(){
  try {
    await api('/api/dosen/classes', { method:'POST', body: JSON.stringify({
      name: document.getElementById('f-name').value.trim(),
      course: document.getElementById('f-course').value.trim() }) });
    renderDashboard();
  } catch (e) {
    const el = document.getElementById('c-err'); el.textContent = e.error; el.classList.remove('hidden');
  }
}

// ===== detail kelas =====
async function bukaKelas(id){
  const list = await api('/api/dosen/classes');
  kelasNow = list.find(c => c.id === id);
  tabNow = 'hasil';
  drawKelas();
}
function drawKelas(){
  app.innerHTML = `
  <div class="topline">
    <button class="btn btn-ghost" onclick="renderDashboard()"><i class="fa-solid fa-arrow-left"></i></button>
    <div style="flex:1"><h2 style="margin:0">${kelasNow.name}</h2><div class="muted">${kelasNow.course || ''} · ${kelasNow.n_students} mahasiswa</div></div>
    <button class="btn" onclick="renderEditor()"><i class="fa-solid fa-plus"></i> Buat Quiz</button>
  </div>
  <div class="tabs">
    <div class="tab ${tabNow === 'hasil' ? 'on' : ''}" onclick="tabNow='hasil';drawKelas()">Hasil</div>
    <div class="tab ${tabNow === 'quiz' ? 'on' : ''}" onclick="tabNow='quiz';drawKelas()">Quiz</div>
    <div class="tab ${tabNow === 'mhs' ? 'on' : ''}" onclick="tabNow='mhs';drawKelas()">Mahasiswa</div>
  </div>
  <div id="tab-body"><div class="card muted"><i class="fa-solid fa-spinner fa-spin"></i> Memuat...</div></div>`;
  if (tabNow === 'hasil') drawTabHasil();
  else if (tabNow === 'quiz') drawTabQuiz();
  else drawTabMhs();
}
async function drawTabMhs(){
  const el = document.getElementById('tab-body');
  const students = await api('/api/dosen/classes/' + kelasNow.id + '/students');
  el.innerHTML = `<div class="card">
    <h2>Mahasiswa Terdaftar (${students.length})</h2>
    ${students.length === 0 ? `<p class="muted">Belum ada mahasiswa. Mahasiswa mendaftar dari halaman utama dengan memilih kelas ini.</p>` : `
    <table><tr><th>Nama</th><th>NPM</th><th>Terdaftar</th></tr>
    ${students.map(s => `<tr><td>${s.nama}</td><td>${s.npm}</td><td class="muted">${s.created_at}</td></tr>`).join('')}
    </table>`}
  </div>`;
}
async function drawTabQuiz(){
  const el = document.getElementById('tab-body');
  const d = await api('/api/dosen/classes/' + kelasNow.id + '/results');
  el.innerHTML = `<div class="card">
    <h2>Quiz di Kelas Ini (${d.quizzes.length})</h2>
    ${d.quizzes.length === 0 ? '<p class="muted">Belum ada quiz di kelas ini.</p>' : ''}
    ${d.quizzes.map(q => `
      <div class="row">
        <span class="tag ${q.type === 'pre' ? 'tag-pre' : 'tag-post'}">${q.type.toUpperCase()}</span>
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${q.title}</div>
          <div class="muted" style="font-size:11.5px;margin-top:2px">
            ${q.duration_min ? q.duration_min + ' menit' : 'tanpa timer'}${q.pair_key ? ' · pasangan: ' + q.pair_key : ''}${q.deadline ? ' · tutup: ' + q.deadline.slice(0, 10) : ''}
          </div>
        </div>
        <span class="muted">${q.n_attempts} dikerjakan</span>
        <button class="btn btn-ghost" onclick="lihatQR(${q.id})" title="QR & link quiz"><i class="fa-solid fa-qrcode"></i></button>
        <button class="btn btn-danger" onclick="hapusQuiz(${q.id})"><i class="fa-regular fa-trash-can"></i></button>
      </div>`).join('')}
  </div>`;
}
async function hapusQuiz(id){
  if (!confirm('Hapus quiz ini beserta semua hasilnya?')) return;
  await api('/api/dosen/quizzes/' + id, { method:'DELETE' });
  drawTabQuiz();
}
async function lihatQR(id){
  const d = await api('/api/dosen/quizzes/' + id + '/qr');
  const m = document.createElement('div');
  m.className = 'modal';
  m.id = 'm-qr';
  m.innerHTML = `
    <div class="box" style="text-align:center">
      <h2 style="margin-bottom:6px"><i class="fa-solid fa-qrcode"></i> QR Quiz #${id}</h2>
      <p class="muted" style="margin-bottom:14px">Mahasiswa scan ini, login/daftar, lalu langsung dibawa ke quiz.</p>
      <img class="qr-img" src="${d.qr}" alt="QR quiz">
      <p style="margin-top:14px;font-size:12.5px;word-break:break-all;background:var(--bg-soft);border:1px solid var(--line);border-radius:8px;padding:10px">${d.url}</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:14px">
        <button class="btn" onclick="salinLink('${d.url}')"><i class="fa-regular fa-copy"></i> Salin Link</button>
        <button class="btn btn-ghost" onclick="document.getElementById('m-qr').remove()">Tutup</button>
      </div>
      <p class="muted" style="margin-top:12px">Klik kanan gambar untuk simpan/cetak, atau ambil screenshot untuk diproyeksikan di kelas.</p>
    </div>`;
  document.body.appendChild(m);
}
function salinLink(url){
  navigator.clipboard.writeText(url).then(() => toast('Link tersalin'));
}
let toastTimer;
function toast(msg){
  let t = document.getElementById('m-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'm-toast';
    t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.opacity = '0', 1800);
}

// ===== impor soal =====
async function renderImport(){
  const m = document.createElement('div');
  m.className = 'modal';
  m.id = 'm-imp';
  m.innerHTML = `
    <div class="box">
      <h2><i class="fa-solid fa-file-import"></i> Impor Soal</h2>
      <p class="muted">Tempel soal atau muat file .txt. Format: soal diawali angka, opsi diawali huruf, kunci ditandai bintang sebelum huruf atau baris "Kunci: X".</p>
      <pre class="muted" style="background:var(--bg-soft);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11.5px;margin:10px 0;white-space:pre-wrap">1. Modal kerja perusahaan terdiri dari...
A. Kas, piutang, dan persediaan
*B. Gedung dan mesin
C. Hutang jangka panjang

2. Tujuan utama manajemen keuangan adalah...
A. Laba akuntansi
B. Nilai perusahaan
Kunci: B</pre>
      <input type="file" id="imp-file" accept=".txt,text/plain" style="margin-bottom:10px">
      <textarea class="ta" id="imp-text" style="min-height:130px" placeholder="atau tempel teks soal di sini..."></textarea>
      <p class="err hidden" id="imp-err"></p>
      <div style="display:flex;gap:10px;margin-top:12px">
        <button class="btn" onclick="doImport()"><i class="fa-solid fa-check"></i> Parse &amp; Tambahkan</button>
        <button class="btn btn-ghost" onclick="document.getElementById('m-imp').remove()">Batal</button>
      </div>
    </div>`;
  document.body.appendChild(m);
  document.getElementById('imp-file').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => document.getElementById('imp-text').value = rd.result;
    rd.readAsText(f);
  };
}
function parseSoal(raw){
  const lines = String(raw || '').split(/\r?\n/).map(l => l.trim()).filter(l => l);
  const qRe = /^\d+\s*[.)]\s*(.+)$/;
  const optRe = /^(\*)?\s*([A-Da-d])\s*[.)]\s*(.+)$/;
  const keyRe = /^(?:kunci|jawaban)\s*[:.]\s*([A-Da-d])\b/i;
  const qs = [];
  let cur = null;
  for (const line of lines) {
    let m;
    if ((m = qRe.exec(line))) {
      if (cur) qs.push(cur);
      cur = { text: m[1], options: [], correct: -1 };
    } else if ((m = optRe.exec(line)) && cur) {
      if (m[1]) cur.correct = cur.options.length;
      cur.options.push(m[3]);
    } else if ((m = keyRe.exec(line)) && cur) {
      cur.correct = m[1].toUpperCase().charCodeAt(0) - 65;
    } else if (cur) {
      cur.text += ' ' + line;
    }
  }
  if (cur) qs.push(cur);
  return qs.filter(q => q.text && q.options.length >= 2 && q.correct >= 0 && q.correct < q.options.length);
}
function doImport(){
  const qs = parseSoal(document.getElementById('imp-text').value);
  const err = document.getElementById('imp-err');
  if (!qs.length) {
    err.textContent = 'Tidak ada soal valid terbaca. Cek format: nomor soal, opsi huruf, kunci bintang atau baris "Kunci: X".';
    err.classList.remove('hidden');
    return;
  }
  draft.questions.push(...qs);
  document.getElementById('m-imp').remove();
  drawQuestions();
  toast(qs.length + ' soal diimpor ke draft');
}
async function drawTabHasil(){
  const el = document.getElementById('tab-body');
  const d = await api('/api/dosen/classes/' + kelasNow.id + '/results');
  const avg = d.class_avg_ngain;
  el.innerHTML = `
  ${avg !== null ? `
  <div class="statbox">
    <b style="font-size:15px"><i class="fa-solid fa-chart-line" style="color:var(--blue)"></i> N-Gain Rerata Kelas: ${avg.toFixed(2)}</b>
    <span class="muted">${avg >= 0.7 ? 'Kategori tinggi' : avg >= 0.3 ? 'Kategori sedang' : 'Kategori rendah'} · dari ${d.students.filter(s => s.avg_ngain !== null).length} mahasiswa yang menyelesaikan pasangan pre-post</span>
  </div>` : ''}
  <div class="card">
    <h2>Hasil Per Mahasiswa</h2>
    ${d.students.length === 0 ? '<p class="muted">Belum ada mahasiswa di kelas ini.</p>' : `
    <table><tr><th>Nama</th><th>NPM</th><th>Paket Pre-Post (Pre / Post / N-Gain)</th><th>Rerata N-Gain</th></tr>
    ${d.students.map(s => `<tr>
      <td>${s.nama}</td><td>${s.npm}</td>
      <td>${s.pairs.length ? s.pairs.map(p => p.ngain !== null
        ? `<span style="white-space:nowrap">${p.key}: ${p.pre} / ${p.post} / <b style="color:var(--green)">${p.ngain.toFixed(2)}</b></span>`
        : `<span class="muted" style="white-space:nowrap">${p.key}: ${p.pre ?? '-'} / ${p.post ?? '-'} / -</span>`).join('<br>') : '<span class="muted">belum ada data</span>'}</td>
      <td style="font-weight:700;color:${s.avg_ngain !== null ? 'var(--green)' : 'var(--muted)'}">${s.avg_ngain !== null ? s.avg_ngain.toFixed(2) : '-'}</td>
    </tr>`).join('')}
    </table>`}
  </div>`;
}

// ===== editor quiz =====
function renderEditor(){
  draft = { class_id: kelasNow.id, title:'', type:'pre', duration_min:20, deadline:'', pair_key:'', questions:[newQ()] };
  drawEditor();
}
function newQ(){ return { text:'', options:['',''], correct:0 }; }
function toggleType(){
  draft.type = draft.type === 'pre' ? 'post' : 'pre';
  drawEditor();
}
function drawEditor(){
  const typeTag = draft.type === 'pre'
    ? '<span class="tag tag-pre tag-click" onclick="toggleType()">PRE TEST</span>'
    : '<span class="tag tag-post tag-click" onclick="toggleType()">POST TEST</span>';
  app.innerHTML = `
  <div class="topline">
    <button class="btn btn-ghost" onclick="bukaKelas(${kelasNow.id})"><i class="fa-solid fa-arrow-left"></i></button>
    ${typeTag}
    <span class="muted">klik tag untuk ganti pre/post · kelas ${kelasNow.name}</span>
  </div>
  <div class="card">
    <div class="grid2">
      <div><label>Judul Quiz</label><input class="input" id="f-title" value="${draft.title}"></div>
      <div><label>Kunci Pasangan (pair key)</label><input class="input" id="f-pair" placeholder="sama utk pre & post-nya, misal: mnf-2026-bab1" value="${draft.pair_key}"></div>
    </div>
    <div class="grid3">
      <div><label>Durasi (menit)</label><input class="input" id="f-dur" type="number" value="${draft.duration_min}"></div>
      <div><label>Buka sampai</label><input class="input" id="f-deadline" type="date"></div>
      <div class="muted" style="align-self:end;padding-bottom:6px">Pasangan pre-post dengan pair key sama menghasilkan N-Gain otomatis.</div>
    </div>
  </div>
  <div id="q-list"></div>
  <button class="btn btn-ghost" style="width:100%;justify-content:center;border-style:dashed;margin-bottom:10px" onclick="tambahSoal()"><i class="fa-solid fa-plus"></i> Tambah Soal</button>
  <button class="btn btn-ghost" style="width:100%;justify-content:center;margin-bottom:14px" onclick="renderImport()"><i class="fa-solid fa-file-import"></i> Impor Soal dari Teks / File .txt</button>
  <div style="display:flex;gap:10px">
    <button class="btn" onclick="simpanQuiz()"><i class="fa-regular fa-paper-plane"></i> Simpan &amp; Aktifkan Quiz</button>
  </div>
  <p class="err hidden" id="e-err"></p>`;
  drawQuestions();
}
function drawQuestions(){
  const el = document.getElementById('q-list');
  el.innerHTML = draft.questions.map((q, qi) => `
    <div class="q-card">
      <div class="q-head"><div class="q-num">${qi + 1}</div>
        <div class="grow">Pilihan ganda</div>
        <button class="btn btn-ghost" style="padding:4px 9px" onclick="hapusSoal(${qi})"><i class="fa-regular fa-trash-can"></i></button></div>
      <textarea class="ta" oninput="draft.questions[${qi}].text=this.value" placeholder="Tulis pertanyaan...">${q.text}</textarea>
      ${q.options.map((o, oi) => `
        <div class="opt-row">
          <div class="radio ${q.correct === oi ? 'correct' : ''}" onclick="draft.questions[${qi}].correct=${oi};drawQuestions()"></div>
          <input class="input" value="${o}" oninput="draft.questions[${qi}].options[${oi}]=this.value" placeholder="Opsi ${'ABCD'[oi] || oi + 1}">
          ${q.correct === oi ? '<span class="key-hint">KUNCI</span>' : ''}
        </div>`).join('')}
      ${q.options.length < 4 ? `<div style="margin-top:8px"><button class="btn btn-ghost" style="padding:5px 11px;font-size:11.5px" onclick="draft.questions[${qi}].options.push('');drawQuestions()"><i class="fa-solid fa-plus"></i> Opsi</button></div>` : ''}
    </div>`).join('');
}
function tambahSoal(){ draft.questions.push(newQ()); drawQuestions(); }
function hapusSoal(i){ draft.questions.splice(i, 1); if (!draft.questions.length) draft.questions.push(newQ()); drawQuestions(); }
async function simpanQuiz(){
  draft.title = document.getElementById('f-title').value.trim();
  draft.duration_min = Number(document.getElementById('f-dur').value) || null;
  draft.deadline = document.getElementById('f-deadline').value;
  draft.pair_key = document.getElementById('f-pair').value.trim();
  try {
    await api('/api/dosen/quizzes', { method:'POST', body: JSON.stringify(draft) });
    bukaKelas(kelasNow.id);
  } catch (e) {
    const el = document.getElementById('e-err');
    el.textContent = e.error || 'Gagal menyimpan';
    el.classList.remove('hidden');
  }
}

// boot
(async () => {
  try {
    me = await api('/api/me');
    if (me.role !== 'dosen') { renderLogin(); return; }
    renderDashboard();
  } catch (e) { renderLogin(); }
})();
</script>
</body>
</html>
