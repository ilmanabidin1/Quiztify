<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Unisba</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --ink:#0b1a30; --ink-soft:#3a4a63; --muted:#71809b; --line:#e4e9f2;
    --bg:#fff; --bg-soft:#f6f8fb; --blue:#1552b3; --blue-soft:#eaf1fd;
    --amber:#f5a623; --amber-soft:#fdf3e0; --green:#1a8a5a; --green-soft:#e8f5ef; --red:#c23b3b;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:var(--bg-soft);color:var(--ink);min-height:100vh}
  header{background:var(--ink);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:11px}
  .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--blue),#2d6fe0);display:flex;align-items:center;justify-content:center;font-size:14px}
  header b{font-size:15px;display:block;line-height:1.2}
  header span{font-size:10.5px;color:#8fa2bf}
  .wrap{max-width:860px;margin:0 auto;padding:22px 18px}
  h2{font-size:16px;font-weight:600;margin-bottom:12px}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .q-row{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .q-row:last-child{border:none}
  .q-row:hover{background:var(--bg-soft)}
  .tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .tag-pre{background:var(--amber-soft);color:#a86a00}
  .tag-post{background:var(--blue-soft);color:var(--blue)}
  .input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--ink);outline:none;background:var(--bg)}
  .input:focus{border-color:var(--blue)}
  label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin:10px 0 5px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:var(--blue);color:#fff}
  .btn:hover{background:#10469a}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:var(--bg);border:1px solid var(--line);color:var(--ink-soft)}
  .opt-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;margin-top:9px;cursor:pointer;font-size:14px}
  .opt-row:hover{border-color:#c4cede;background:var(--bg-soft)}
  .opt-row.picked{border-color:var(--blue);background:var(--blue-soft);font-weight:600}
  .opt-idx{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0}
  .opt-row.picked .opt-idx{background:var(--blue);border-color:var(--blue);color:#fff}
  .qtext{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:4px}
  .qnum{font-size:11px;color:var(--muted);margin-bottom:6px}
  .progress{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
  .progress i{display:block;height:100%;background:var(--blue);transition:.3s}
  .result{text-align:center;padding:26px 10px}
  .result .big{font-size:46px;font-weight:800;color:var(--blue)}
  .result .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .ngain{display:inline-block;background:var(--green-soft);color:var(--green);font-weight:700;padding:6px 14px;border-radius:20px;font-size:13px;margin-top:12px}
  .hidden{display:none}
  .timer{font-size:13px;font-weight:700;color:var(--ink-soft)}
  .timer.low{color:var(--red)}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
  <div><b>Quiz Unisba</b><span>Platform Pre & Post Test Mahasiswa</span></div>
</header>
<div class="wrap" id="app"></div>

<script>
const app = document.getElementById('app');
let me = { nama:'', npm:'' };
let timerId = null;

// ---- STEP 1: identitas mahasiswa ----
function renderIdentitas(){
  app.innerHTML = `
  <div class="card">
    <h2><i class="fa-solid fa-user"></i> Masuk sebagai Mahasiswa</h2>
    <p class="muted">Isi nama lengkap dan NPM untuk melihat daftar quiz yang terbuka.</p>
    <label>Nama Lengkap</label>
    <input class="input" id="in-nama" placeholder="misal: Aisyah Ramadhani" autocomplete="name">
    <label>NPM</label>
    <input class="input" id="in-npm" placeholder="6-12 digit" inputmode="numeric" autocomplete="off">
    <div style="margin-top:16px"><button class="btn" onclick="masuk()"><i class="fa-solid fa-arrow-right"></i> Masuk</button></div>
    <p id="id-err" style="color:var(--red);font-size:13px;margin-top:10px"></p>
  </div>`;
}
async function masuk(){
  const nama = document.getElementById('in-nama').value.trim();
  const npm = document.getElementById('in-npm').value.trim();
  if (!nama || !/^\d{6,12}$/.test(npm)) {
    document.getElementById('id-err').textContent = 'Nama wajib diisi dan NPM harus 6-12 digit angka.';
    return;
  }
  me = { nama, npm };
  localStorage.setItem('qunisba-me', JSON.stringify(me));
  renderDaftar();
}

// ---- STEP 2: daftar quiz terbuka ----
async function renderDaftar(){
  app.innerHTML = '<div class="card muted"><i class="fa-solid fa-spinner fa-spin"></i> Memuat daftar quiz...</div>';
  const [res, st] = await Promise.all([
    fetch('/api/quizzes').then(r => r.json()),
    fetch('/api/my-status?npm=' + encodeURIComponent(me.npm)).then(r => r.json())
  ]);
  const done = new Set(st.done || []);
  const now = Date.now();
  const list = res.filter(q => !q.deadline || new Date(q.deadline).getTime() > now);
  app.innerHTML = `
  <div class="topbar"><h2>Daftar Quiz, ${me.nama}</h2>
    <button class="btn btn-ghost" onclick="keluar()"><i class="fa-solid fa-right-from-bracket"></i></button></div>
  <div class="card">
    ${list.length === 0 ? '<p class="muted">Belum ada quiz yang terbuka saat ini.</p>' : ''}
    ${list.map(q => {
      const sudah = done.has(q.id);
      return `<div class="q-row" ${sudah ? '' : `onclick="bukaQuiz(${q.id})"`}>
        <span class="tag ${q.type === 'pre' ? 'tag-pre' : 'tag-post'}">${q.type.toUpperCase()} TEST</span>
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${q.title}</div>
          <div class="muted" style="font-size:11.5px;margin-top:3px">${q.course || ''}${q.class_name ? ' · Kelas ' + q.class_name : ''}${q.duration_min ? ' · ' + q.duration_min + ' menit' : ''}</div>
        </div>
        ${sudah ? '<span class="tag" style="background:var(--green-soft);color:var(--green)">Sudah dikerjakan</span>' : '<i class="fa-solid fa-chevron-right" style="color:var(--muted)"></i>'}
      </div>`;
    }).join('')}
  </div>`;
}
function keluar(){
  localStorage.removeItem('qunisba-me');
  me = { nama:'', npm:'' };
  renderIdentitas();
}

// ---- STEP 3: kerjakan quiz ----
let quizNow = null;
async function bukaQuiz(id){
  app.innerHTML = '<div class="card muted"><i class="fa-solid fa-spinner fa-spin"></i> Memuat soal...</div>';
  const q = await fetch('/api/quizzes/' + id).then(r => r.json());
  if (q.error) { app.innerHTML = `<div class="card muted">${q.error}</div>`; return; }
  quizNow = q;
  renderSoal(0, {});
}

function renderSoal(pos, answers){
  const q = quizNow.questions[pos];
  const pct = Math.round((pos / quizNow.questions.length) * 100);
  app.innerHTML = `
  <div class="topbar"><h2>${quizNow.title}</h2><span class="timer" id="timer">${quizNow.duration_min ? quizNow.duration_min + ':00' : ''}</span></div>
  <div class="progress"><i style="width:${pct}%"></i></div>
  <div class="card">
    <div class="qnum">Soal ${pos + 1} dari ${quizNow.questions.length}</div>
    <div class="qtext">${q.text}</div>
    ${q.options.map((o, i) => `
      <div class="opt-row ${answers[q.id] === i ? 'picked' : ''}" onclick="jawab(${pos}, ${i})">
        <span class="opt-idx">${'ABCD'[i] || i + 1}</span>${o}
      </div>`).join('')}
  </div>
  <div style="display:flex;justify-content:space-between">
    <button class="btn btn-ghost" ${pos === 0 ? 'disabled' : ''} onclick="renderSoal(${pos - 1}, answersCache)"><i class="fa-solid fa-arrow-left"></i> Sebelumnya</button>
    ${pos === quizNow.questions.length - 1
      ? '<button class="btn" onclick="submitQuiz()"><i class="fa-regular fa-paper-plane"></i> Kirim Jawaban</button>'
      : '<button class="btn" onclick="renderSoal(' + (pos + 1) + ', answersCache)">Lanjut <i class="fa-solid fa-arrow-right"></i></button>'}
  </div>`;
  startTimerOnce();
}

let answersCache = {};
function jawab(pos, i){
  const q = quizNow.questions[pos];
  answersCache[q.id] = i;
  renderSoal(pos, answersCache);
}

let deadlineTs = null;
function startTimerOnce(){
  if (!quizNow.duration_min || deadlineTs) return;
  deadlineTs = Date.now() + quizNow.duration_min * 60000;
  timerId = setInterval(() => {
    const left = Math.max(0, deadlineTs - Date.now());
    const el = document.getElementById('timer');
    if (el) {
      const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
      el.textContent = m + ':' + String(s).padStart(2, '0');
      el.classList.toggle('low', left < 60000);
    }
    if (left <= 0) { clearInterval(timerId); submitQuiz(); }
  }, 500);
}

async function submitQuiz(){
  if (timerId) clearInterval(timerId);
  const unanswered = quizNow.questions.filter(q => answersCache[q.id] === undefined).length;
  if (unanswered > 0 && !confirm('Masih ada ' + unanswered + ' soal belum dijawab. Kirim sekarang?')) return;
  app.innerHTML = '<div class="card muted"><i class="fa-solid fa-spinner fa-spin"></i> Mengirim jawaban...</div>';
  const res = await fetch('/api/quizzes/' + quizNow.id + '/submit', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nama: me.nama, npm: me.npm, answers: answersCache })
  }).then(r => r.json());
  if (res.error) { app.innerHTML = `<div class="card" style="color:var(--red)"><i class="fa-solid fa-circle-exclamation"></i> ${res.error}</div>`; return; }
  deadlineTs = null;
  renderHasil(res);
}

function renderHasil(res){
  app.innerHTML = `
  <div class="card result">
    <div class="big">${res.score}</div>
    <div class="sub">Skor kamu, benar ${res.correct} dari ${res.total} soal</div>
    ${res.ngain !== null ? `<div class="ngain"><i class="fa-solid fa-chart-line"></i> N-Gain kamu: ${res.ngain.toFixed(2)}</div>` : ''}
    <div style="margin-top:18px"><button class="btn" onclick="renderDaftar()"><i class="fa-solid fa-list"></i> Kembali ke Daftar Quiz</button></div>
  </div>`;
}

// boot
const saved = localStorage.getItem('qunisba-me');
if (saved) { me = JSON.parse(saved); renderDaftar(); } else renderIdentitas();
</script>
</body>
</html>
