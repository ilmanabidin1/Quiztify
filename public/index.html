<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Unisba</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --ink:#0b1a30; --ink-soft:#3a4a63; --muted:#71809b; --line:#e4e9f2;
    --bg:#fff; --bg-soft:#f6f8fb; --blue:#1552b3; --blue-soft:#eaf1fd;
    --amber:#f5a623; --amber-soft:#fdf3e0; --green:#1a8a5a; --green-soft:#e8f5ef; --red:#c23b3b;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:var(--bg-soft);color:var(--ink);min-height:100vh}
  header{background:var(--ink);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:11px}
  .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--blue),#2d6fe0);display:flex;align-items:center;justify-content:center;font-size:14px}
  header b{font-size:15px;display:block;line-height:1.2}
  header span{font-size:10.5px;color:#8fa2bf}
  .wrap{max-width:860px;margin:0 auto;padding:22px 18px}
  h2{font-size:16px;font-weight:600;margin-bottom:12px}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .q-row{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line)}
  .q-row.click{cursor:pointer}
  .q-row.click:hover{background:var(--bg-soft)}
  .q-row:last-child{border:none}
  .tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .tag-pre{background:var(--amber-soft);color:#a86a00}
  .tag-post{background:var(--blue-soft);color:var(--blue)}
  .tag-ok{background:var(--green-soft);color:var(--green)}
  .tag-lock{background:var(--bg-soft);color:var(--muted);border:1px solid var(--line)}
  .input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--ink);outline:none;background:var(--bg)}
  .input:focus{border-color:var(--blue)}
  label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin:10px 0 5px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:var(--blue);color:#fff}
  .btn:hover{background:#10469a}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:var(--bg);border:1px solid var(--line);color:var(--ink-soft)}
  .opt-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;margin-top:9px;cursor:pointer;font-size:14px}
  .opt-row:hover{border-color:#c4cede;background:var(--bg-soft)}
  .opt-row.picked{border-color:var(--blue);background:var(--blue-soft);font-weight:600}
  .opt-idx{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0}
  .opt-row.picked .opt-idx{background:var(--blue);border-color:var(--blue);color:#fff}
  .qtext{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:4px}
  .qnum{font-size:11px;color:var(--muted);margin-bottom:6px}
  .progress{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
  .progress i{display:block;height:100%;background:var(--blue);transition:.3s}
  .result{text-align:center;padding:26px 10px}
  .result .big{font-size:46px;font-weight:800;color:var(--blue)}
  .result .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .ngain{display:inline-block;background:var(--green-soft);color:var(--green);font-weight:700;padding:6px 14px;border-radius:20px;font-size:13px;margin-top:12px}
  .timer{font-size:13px;font-weight:700;color:var(--ink-soft)}
  .timer.low{color:var(--red)}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .muted{color:var(--muted);font-size:13px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink-soft)}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:9px 10px;background:var(--bg-soft);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
  td{padding:10px;border-bottom:1px solid var(--line)}
  tr:last-child td{border:none}
  .err{color:var(--red);font-size:13px;margin-top:8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head>
<body>
<header>
  <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
  <div><b>Quiz Unisba</b><span>Platform Pre &amp; Post Test Mahasiswa</span></div>
</header>
<div class="wrap" id="app"></div>

<script>
const app = document.getElementById('app');
let timerId = null, deadlineTs = null, answersCache = {}, quizNow = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw d;
  return d;
}

// ===== auth =====
let authMode = 'login';
function renderAuth(){
  const login = authMode === 'login';
  app.innerHTML = `
  <div class="card" style="max-width:440px;margin:24px auto">
    <div class="tabs">
      <div class="tab ${login ? 'on' : ''}" onclick="authMode='login';renderAuth()">Masuk</div>
      <div class="tab ${!login ? 'on' : ''}" onclick="authMode='daftar';renderAuth()">Daftar Baru</div>
    </div>
    ${login ? `
      <h2><i class="fa-solid fa-user"></i> Masuk Mahasiswa</h2>
      <label>NPM</label><input class="input" id="in-npm" inputmode="numeric" placeholder="6-12 digit">
      <label>Password</label><input class="input" id="in-pass" type="password" onkeydown="if(event.key==='Enter')doLogin()">
      <div style="margin-top:16px"><button class="btn" onclick="doLogin()"><i class="fa-solid fa-arrow-right"></i> Masuk</button></div>
      <p class="err hidden" id="a-err"></p>
    ` : `
      <h2><i class="fa-solid fa-user-plus"></i> Daftar Mahasiswa</h2>
      <p class="muted">Daftar dengan NPM dan password, lalu pilih kelas yang dibuka dosen kamu.</p>
      <label>Nama Lengkap</label><input class="input" id="in-nama" placeholder="misal: Aisyah Ramadhani">
      <label>NPM</label><input class="input" id="in-npm" inputmode="numeric" placeholder="6-12 digit">
      <label>Password (min 6 karakter)</label><input class="input" id="in-pass" type="password">
      <label>Pilih Kelas</label><select class="input" id="in-class"><option>Memuat...</option></select>
      <div style="margin-top:16px"><button class="btn" onclick="doRegister()"><i class="fa-solid fa-user-plus"></i> Daftar &amp; Masuk</button></div>
      <p class="err hidden" id="a-err"></p>
    `}
    <p class="muted" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      Dosen? Masuk lewat <a href="/dosen.html">panel dosen</a>.</p>
  </div>`;
  if (!login) loadClasses();
}
async function loadClasses(){
  const list = await api('/api/classes/public');
  const sel = document.getElementById('in-class');
  sel.innerHTML = list.length
    ? list.map(c => `<option value="${c.id}">${c.name}${c.course ? ' - ' + c.course : ''} (${c.n_students} mahasiswa)</option>`).join('')
    : '<option value="">Belum ada kelas terbuka, hubungi dosen</option>';
}
function showErr(msg){ const e = document.getElementById('a-err'); e.textContent = msg; e.classList.remove('hidden'); }
async function doLogin(){
  try {
    await api('/api/auth/mahasiswa/login', { method:'POST', body: JSON.stringify({
      npm: document.getElementById('in-npm').value.trim(),
      password: document.getElementById('in-pass').value }) });
    boot();
  } catch (e) { showErr(e.error || 'Gagal masuk'); }
}
async function doRegister(){
  try {
    await api('/api/auth/mahasiswa/register', { method:'POST', body: JSON.stringify({
      nama: document.getElementById('in-nama').value.trim(),
      npm: document.getElementById('in-npm').value.trim(),
      password: document.getElementById('in-pass').value,
      class_id: Number(document.getElementById('in-class').value) }) });
    boot();
  } catch (e) { showErr(e.error || 'Gagal mendaftar'); }
}
async function logout(){ await api('/api/auth/logout', { method:'POST' }); renderAuth(); }

// ===== halaman utama mahasiswa =====
let me = null;
async function renderHome(){
  app.innerHTML = '<div class="card muted"><i class="fa-solid fa-spinner fa-spin"></i> Memuat...</div>';
  const [quizzes, hasil] = await Promise.all([
    api('/api/student/quizzes'), api('/api/student/results')
  ]);
  const belum = quizzes.filter(q => !q.done);
  const selesai = quizzes.filter(q => q.done);
  app.innerHTML = `
  <div class="topbar">
    <div><h2 style="margin:0">Halo, ${me.nama}</h2>
      <div class="muted">Kelas ${me.class_name || '-'}${me.course ? ' - ' + me.course : ''} · NPM ${me.npm}</div></div>
    <button class="btn btn-ghost" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
  </div>
  <div class="card">
    <h2>Quiz Menunggu Dikerjakan</h2>
    ${belum.length === 0 ? '<p class="muted">Tidak ada quiz yang menunggu.</p>' : ''}
    ${belum.map(q => quizRow(q)).join('')}
  </div>
  ${selesai.length ? `
  <div class="card">
    <h2>Sudah Dikerjakan</h2>
    ${selesai.map(q => quizRow(q, true)).join('')}
  </div>` : ''}
  ${hasil.gains.length ? `
  <div class="card">
    <h2>Perkembangan Pre vs Post</h2>
    <table><tr><th>Paket</th><th>Pre</th><th>Post</th><th>N-Gain</th></tr>
    ${hasil.gains.map(g => `<tr><td>${g.key}</td><td>${g.pre}</td><td>${g.post}</td>
      <td style="font-weight:700;color:var(--green)">${g.ngain.toFixed(2)}</td></tr>`).join('')}
    </table>
  </div>` : ''}`;
}
function quizRow(q, done){
  const status = done
    ? `<span style="font-weight:700;color:var(--blue)">${q.my_score}</span><span class="tag tag-ok" style="margin-left:8px">Selesai</span>`
    : q.open ? '<i class="fa-solid fa-chevron-right" style="color:var(--muted)"></i>'
             : '<span class="tag tag-lock">Ditutup</span>';
  return `<div class="q-row ${!done && q.open ? 'click' : ''}" ${!done && q.open ? `onclick="bukaQuiz(${q.id})"` : ''}>
    <span class="tag ${q.type === 'pre' ? 'tag-pre' : 'tag-post'}">${q.type.toUpperCase()} TEST</span>
    <div style="flex:1">
      <div style="font-weight:600;font-size:14px">${q.title}</div>
      <div class="muted" style="font-size:11.5px;margin-top:3px">${q.duration_min ? q.duration_min + ' menit' : 'tanpa batas waktu'}</div>
    </div>${status}</div>`;
}

// ===== kerjakan quiz =====
async function bukaQuiz(id){
  app.innerHTML = '<div class="card muted"><i class="fa-solid fa-spinner fa-spin"></i> Memuat soal...</div>';
  try {
    quizNow = await api('/api/student/quiz/' + id);
    answersCache = {}; deadlineTs = null;
    renderSoal(0);
  } catch (e) { app.innerHTML = `<div class="card" style="color:var(--red)">${e.error}</div>`; }
}
function renderSoal(pos){
  const q = quizNow.questions[pos];
  const pct = Math.round((pos / quizNow.questions.length) * 100);
  app.innerHTML = `
  <div class="topbar"><h2>${quizNow.title}</h2><span class="timer" id="timer">${quizNow.duration_min ? quizNow.duration_min + ':00' : ''}</span></div>
  <div class="progress"><i style="width:${pct}%"></i></div>
  <div class="card">
    <div class="qnum">Soal ${pos + 1} dari ${quizNow.questions.length}</div>
    <div class="qtext">${q.text}</div>
    ${q.options.map((o, i) => `
      <div class="opt-row ${answersCache[q.id] === i ? 'picked' : ''}" onclick="jawab(${pos}, ${i})">
        <span class="opt-idx">${'ABCD'[i] || i + 1}</span>${o}</div>`).join('')}
  </div>
  <div style="display:flex;justify-content:space-between">
    <button class="btn btn-ghost" ${pos === 0 ? 'disabled' : ''} onclick="renderSoal(${pos - 1})"><i class="fa-solid fa-arrow-left"></i> Sebelumnya</button>
    ${pos === quizNow.questions.length - 1
      ? '<button class="btn" onclick="submitQuiz()"><i class="fa-regular fa-paper-plane"></i> Kirim Jawaban</button>'
      : `<button class="btn" onclick="renderSoal(${pos + 1})">Lanjut <i class="fa-solid fa-arrow-right"></i></button>`}
  </div>`;
  startTimerOnce();
}
function jawab(pos, i){
  answersCache[quizNow.questions[pos].id] = i;
  renderSoal(pos);
}
function startTimerOnce(){
  if (!quizNow.duration_min || deadlineTs) return;
  deadlineTs = Date.now() + quizNow.duration_min * 60000;
  timerId = setInterval(() => {
    const left = Math.max(0, deadlineTs - Date.now());
    const el = document.getElementById('timer');
    if (el) {
      el.textContent = Math.floor(left / 60000) + ':' + String(Math.floor(left % 60000 / 1000)).padStart(2, '0');
      el.classList.toggle('low', left < 60000);
    }
    if (left <= 0) { clearInterval(timerId); submitQuiz(); }
  }, 500);
}
async function submitQuiz(){
  if (timerId) clearInterval(timerId);
  const kosong = quizNow.questions.filter(q => answersCache[q.id] === undefined).length;
  if (kosong > 0 && !confirm('Masih ada ' + kosong + ' soal belum dijawab. Kirim sekarang?')) return;
  app.innerHTML = '<div class="card muted"><i class="fa-solid fa-spinner fa-spin"></i> Mengirim jawaban...</div>';
  try {
    const res = await api('/api/student/quiz/' + quizNow.id + '/submit', {
      method: 'POST', body: JSON.stringify({ answers: answersCache }) });
    deadlineTs = null;
    app.innerHTML = `
    <div class="card result">
      <div class="big">${res.score}</div>
      <div class="sub">Skor kamu, benar ${res.correct} dari ${res.total} soal</div>
      ${res.ngain !== null ? `<div class="ngain"><i class="fa-solid fa-chart-line"></i> N-Gain kamu: ${res.ngain.toFixed(2)}</div>` : ''}
      <div style="margin-top:18px"><button class="btn" onclick="renderHome()"><i class="fa-solid fa-list"></i> Kembali</button></div>
    </div>`;
  } catch (e) {
    app.innerHTML = `<div class="card" style="color:var(--red)"><i class="fa-solid fa-circle-exclamation"></i> ${e.error}</div>`;
  }
}

// boot: cek sesi
async function boot(){
  try {
    me = await api('/api/me');
    if (me.role !== 'mahasiswa') { renderAuth(); return; }
    renderHome();
  } catch (e) { renderAuth(); }
}
boot();
</script>
</body>
</html>
